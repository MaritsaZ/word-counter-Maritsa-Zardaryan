<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
</head>
<body>
    <h1>Word Counter</h1>
    <textarea id="textInput" rows="10" cols="50" placeholder="Type your text here..."></textarea>
   
    <button id="countButton">Count</button>
    
    <p>Letters: <span id="letters">0</span></p>
    <p>Words: <span id="words">0</span></p>
    <p>Sentences: <span id="sentences">0</span></p>
    <p> 
        <button onclick="changeBg()">Change Background Color</button>
    </p>

    <script src="wordcounter.js"></script>
</body>
</html>
